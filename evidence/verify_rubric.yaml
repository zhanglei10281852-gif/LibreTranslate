rubrics:
  - id: 1
    type: p2p
    text: 未启用文件翻译、普通短任务、自动检测、支持格式、字符限额计费和成功下载的现有外部行为保持兼容。
  - id: 2
    type: f2p
    text: 复用现有 UUID 产物身份时，上传输入和候选输出在完整翻译成功前不会作为可下载结果暴露，成功发布后 URL 只对应完整文件。
  - id: 3
    type: f2p
    text: 翻译失败、检测失败或请求取消时，本次未发布的输入与候选输出被清理，不会留下可下载半成品或永久孤儿文件。
  - id: 4
    type: f2p
    text: 清理扫描与长时间翻译或正在进行的下载并发时不会删除活跃文件，下载只会得到完整结果或稳定的过期与不存在错误。
  - id: 5
    type: f2p
    text: 产物过期后多个 worker 同时扫描时只有一个回收者完成状态转换和删除，重复扫描不会报错、重复发布或留下不一致记录。
  - id: 6
    type: f2p
    text: worker 在翻译、发布、下载或回收阶段退出后，重启的 worker 能按状态接管清理或继续提供已发布结果，不会永久保留活动租约。
  - id: 7
    type: p2p
    text: 既有 UUID 文件名、路径遍历防护、原始文件名下载展示和禁用文件翻译时的拒绝语义保持不变，尚未发布的产物不能绕过状态检查直接读取。
